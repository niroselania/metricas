<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Ventas · Centro de control</title>
<style>

html[data-theme="light"]{
 --bg:#eef2f8;--panel:rgba(255,255,255,.85);--panel-solid:#fff;--line:rgba(15,23,42,.09);--line-2:rgba(15,23,42,.16);
 --ink:#0f172a;--muted:#52617a;--dim:#8391a7;--cyan:#0891b2;--cyan-soft:rgba(8,145,178,.1);--violet:#7c3aed;
 --green:#059669;--red:#e11d48;--amber:#b45309;--track:rgba(15,23,42,.08);--grid:rgba(15,23,42,.045);
 --shadow:0 18px 40px rgba(15,23,42,.08);--glow:0 0 0 1px rgba(8,145,178,.35),0 8px 24px rgba(8,145,178,.12)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 48px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--cyan-soft);box-shadow:var(--glow);color:var(--cyan);font-weight:700}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:8px 14px;cursor:pointer}
select.btn option{background:var(--panel-solid);color:var(--ink)}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.pill{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--panel)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tab{font:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.tab.on{color:var(--cyan);border-color:transparent;box-shadow:var(--glow);background:var(--cyan-soft)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;backdrop-filter:blur(10px)}
.ptitle{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 14px;display:flex;justify-content:space-between;gap:8px}
.donuts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.dcard{text-align:center;padding:22px 14px 18px}
.dcard h3{margin:0 0 10px;font-size:15px;font-weight:600}
.dcard svg{width:100%;max-width:210px;height:auto;display:block;margin:0 auto}
.dval{font-family:var(--mono);font-weight:700;fill:var(--ink)}
.dlab{fill:var(--muted);font-size:11px}
.dfoot{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.dfoot b{color:var(--ink);font-family:var(--mono);font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:8px}
.ok{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.warn{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.bad{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:6px;white-space:nowrap}
.row{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini .m{text-align:center;cursor:pointer;border-radius:12px;padding:8px 4px;border:1px solid transparent;color:var(--ink);background:transparent;font:inherit;width:100%}
.mini .m:hover{border-color:var(--line-2)}
.mini svg{width:100%;max-width:120px}
.mini .n{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:end;padding:8px 6px;border-bottom:1px solid var(--line-2);font-weight:600}
td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:end;font-family:var(--mono);font-size:12.5px}
th:first-child,td:first-child{text-align:start;font-family:var(--font)}
tr.tot td{font-weight:700;color:var(--cyan)}
.bar{height:6px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet))}
#chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;background:var(--c)}
.tip{position:fixed;pointer-events:none;background:var(--panel-solid);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);display:none;z-index:9;font-family:var(--mono)}
footer{color:var(--dim);font-size:12px;margin-top:22px;text-align:center}
.msg{font-size:12px;color:var(--amber)}
.summary{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:12px;margin:0 0 16px}
.summary-main,.summary-item{padding:16px 18px}
.summary-main{background:linear-gradient(135deg,var(--cyan-soft),var(--panel))}
.summary-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.summary-value{font-size:clamp(22px,2vw,30px);font-weight:750;letter-spacing:-.03em;margin-top:6px}
.summary-note{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{min-width:600px}
button:focus-visible,select:focus-visible,label.btn:focus-within{outline:3px solid var(--cyan);outline-offset:2px}
@media (max-width:980px){.summary{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.summary{grid-template-columns:1fr 1fr}.summary-main{grid-column:1/-1}.panel{padding:15px}.actions{width:100%}.actions>*{flex:1}.pill{text-align:center}}
@media (max-width:980px){.donuts{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(3,1fr)}.row{grid-template-columns:1fr}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.mini{grid-template-columns:repeat(2,1fr)}}
@media print{.actions,.tabs{display:none}body{background:#fff}}
</style>
</head>

 const c=size/2,r=c-stroke/2-4,tot=segs.reduce((s,x)=>s+x.v,0)||1;let a=-Math.PI/2,out="";
 segs.forEach(sg=>{const span=2*Math.PI*sg.v/tot;if(span<=0)return;const gap=segs.length>1?.03:0;
  out+=span>=2*Math.PI-1e-6?`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${sg.c}" stroke-width="${stroke}"/>`:
  `<path d="${arc(c,c,r,a+gap/2,a+span-gap/2)}" fill="none" stroke="${sg.c}" stroke-width="${stroke}" stroke-linecap="butt" data-tip="${esc(sg.n)}: ${nf0.format(sg.v)} U (${pct(sg.v/tot)})"/>`;a+=span});
 return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>${out}
 <text x="${c}" y="${c+4}" text-anchor="middle" class="dval" font-size="${size*.13}">${esc(center)}</text>
 <text x="${c}" y="${c+size*.14}" text-anchor="middle" class="dlab" font-size="${size*.062}">${esc(label)}</text></svg>`}

function render(){
 const D=alcanceDias(), a=agg(sel);
 $("sub").textContent=`${DATA.mes} · ${sel==="TOTAL"?"Todos los canales":sel}`;
 $("pace").textContent=`Día ${D.day} de ${DATA.days} · Alcance días ${pct(D.ratio)}`;
 $("tabs").innerHTML=ORDER.map(k=>`<button class="tab${k===sel?" on":""}" data-k="${k}" type="button" aria-pressed="${k===sel}">${k==="TOTAL"?"TOTALES":k}</button>`).join("");
 const s$=status(a.alc,D.ratio), sU=status(a.alcU,D.ratio);
 const gap=Math.max(0,a.fct-a.venta),remaining=Math.max(0,DATA.days-D.day),needed=remaining?gap/remaining:0;
 const comp=previousMonthComparison(a,D),compText=comp?(comp.change===null?"Sin base comparable":`${comp.change>=0?"+":""}${pct(comp.change)} vs. ${comp.month}`):"No hay mes anterior cargado";
 $("summary").innerHTML=`<div class="panel summary-main"><div class="summary-label">Ventas acumuladas · ${esc(DATA.mes)}</div><div class="summary-value">${short(a.venta)}</div><div class="summary-note">${pct(a.alc)} del objetivo de ${short(a.fct)} · ${s$[1]}</div></div><div class="panel summary-item"><div class="summary-label">Brecha al objetivo</div><div class="summary-value">${short(gap)}</div><div class="summary-note">${gap?"Pendiente para alcanzar el FCT":"Objetivo alcanzado"}</div></div><div class="panel summary-item"><div class="summary-label">Ritmo diario requerido</div><div class="summary-value">${remaining?short(needed):"—"}</div><div class="summary-note">${remaining?`por día durante ${remaining} días calendario`:"Período cerrado"}</div></div><div class="panel summary-item"><div class="summary-label">Comparación al mismo día</div><div class="summary-value">${comp&&comp.change!==null?`${comp.change>=0?"+":""}${pct(comp.change)}`:"—"}</div><div class="summary-note">${comp?`${compText} · primeros ${comp.days} días`:compText}</div></div>`;
 const fctSegs=sel==="TOTAL"||sel==="RETAIL"
   ? a.list.map(c=>({n:c,v:DATA.canales[c].fctU,c:COLORS[c]}))
   : [{n:"Vendidas",v:Math.min(a.u,a.fctU),c:COLORS[sel]},{n:"Pendientes",v:Math.max(0,a.fctU-a.u),c:"var(--track)"}];
 $("donuts").innerHTML=`
 <div class="panel dcard"><h3>Alcance ($)</h3>${ring(a.alc,colorOf(a.alc,D.ratio),pct(a.alc),"de FCT ($)",200,18,D.ratio)}
  <div class="dfoot">Venta <b>${short(a.venta)}</b> · FCT <b>${short(a.fct)}</b></div><span class="badge ${s$[0]}">${s$[1]}</span></div>
 <div class="panel dcard"><h3>FCT (U)</h3>${segRing(fctSegs,nf0.format(a.fctU),"unidades objetivo")}
  <div class="dfoot">${sel==="TOTAL"||sel==="RETAIL"?"Reparto por canal":"Vendidas vs pendientes"} · faltan <b>${nf0.format(Math.max(0,a.fctU-a.u))}</b> U</div>
  <div class="legend" style="justify-content:center;margin-top:8px">${fctSegs.filter(x=>x.n!=="Pendientes").map(x=>`<span style="--c:${x.c}">${esc(x.n)}</span>`).join("")}</div></div>
 <div class="panel dcard"><h3>Alcance (U)</h3>${ring(a.alcU,colorOf(a.alcU,D.ratio),pct(a.alcU),"de FCT (U)",200,18,D.ratio)}
  <div class="dfoot">Unidades <b>${nf0.format(a.u)}</b> · FCT <b>${nf0.format(a.fctU)}</b></div><span class="badge ${sU[0]}">${sU[1]}</span></div>`;
 const k=[["Monto de venta · sin IVA",short(a.venta)],["Unidades netas",nf0.format(a.u)],["Objetivo FCT · sin IVA",short(a.fct)],["Tickets",nf0.format(a.tk)],
  ["Precio promedio por unidad",a.u?money(a.venta/a.u):"–"],["Venta promedio por ticket",a.tk&&sel!=="MAYORISTA"?money(a.venta/a.tk):"–"]];
 $("kpis").innerHTML=k.map(x=>`<div class="panel kpi"><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join("");
 $("mini").innerHTML=["RETIRO","BARILOCHE","E-COMMERCE","MAYORISTA"].map(c=>{const x=agg(c);return `<button class="m" type="button" data-k="${c}" aria-label="Ver canal ${c}">${ring(x.alc,COLORS[c],pct(x.alc),short(x.venta),120,11,D.ratio)}<div class="n">${c}</div></button>`}).join("");
 drawChart(a,D);
 const rows=["RETAIL","RETIRO","BARILOCHE","E-COMMERCE","MAYORISTA","TOTAL"].map(c=>{const x=agg(c);return `<tr class="${c==="TOTAL"?"tot":""}"><td>${c==="TOTAL"?"TOTALES":c}</td><td>${short(x.venta)}</td><td>${nf0.format(x.u)}</td><td>${short(x.fct)}</td><td>${pct(x.alc)}</td><td>${nf0.format(x.fctU)}</td><td>${pct(x.alcU)}</td></tr>`}).join("");
 $("tbl").innerHTML=`<table><thead><tr><th>Canal</th><th>Venta sin IVA</th><th>Unidades</th><th>Objetivo $</th><th>Avance $</th><th>Objetivo U</th><th>Avance U</th></tr></thead><tbody>${rows}</tbody></table>`;
 $("lt").textContent=sel==="TOTAL"?"todos":sel.toLowerCase();
 const top=showAllLines?a.lineas:a.lineas.slice(0,8),mx=Math.max(1,...top.map(l=>l[1]));
 $("toggleLines").textContent=showAllLines?"Ver principales":`Ver todas (${a.lineas.length})`;
 $("lineas").innerHTML=top.map(l=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span>${esc(l[0])}</span><span style="font-family:var(--mono);color:var(--muted)">${short(l[1])} · ${nf0.format(l[2])} U</span></div><div class="bar"><i style="width:${(l[1]/mx*100).toFixed(1)}%"></i></div></div>`).join("")||'<div class="sub">Sin datos</div>';
 $("foot").textContent=`Fuente: ${DATA.fuente} · Montos sin IVA · FCT = objetivo mensual · Comparación contra el mes anterior al mismo día calendario · Ritmo requerido distribuido en días calendario`;
}
function drawChart(a,D){
 const W=720,H=260,p={l:58,r:62,t:20,b:28},n=DATA.days,iw=W-p.l-p.r,ih=H-p.t-p.b,bw=iw/n;
 let cum=0;const cumA=a.diario.map(v=>cum+=v),maxBar=Math.max(...a.diario,1),maxCum=Math.max(a.fct,cum,1);
 const yb=v=>p.t+ih-(v/maxBar)*ih,yc=v=>p.t+ih-(v/maxCum)*ih;
 let g="";for(let i=0;i<=4;i++){const dv=maxBar*i/4,cv=maxCum*i/4,y=yc(cv);g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${p.l-7}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--dim)">${short(dv).replace("$ ","")}</text><text x="${W-p.r+7}" y="${y+4}" text-anchor="start" font-size="10" fill="var(--dim)">${short(cv).replace("$ ","")}</text>`}
 let bars="";a.diario.forEach((v,i)=>{const x=p.l+i*bw+bw*.18,y=yb(v);bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${(p.t+ih-y).toFixed(1)}" rx="2" fill="var(--cyan)" opacity="${i<D.day?.85:.25}" data-tip="${i+1}/${DATA.month}: ${money(v)}"/>`;
  if((i+1)%5===0||i===0)bars+=`<text x="${p.l+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--dim)">${i+1}</text>`});
 const upto=Math.max(0,Math.min(n,D.day));
 const line=cumA.slice(0,upto).map((v,i)=>`${i?"L":"M"}${(p.l+i*bw+bw/2).toFixed(1)} ${yc(v).toFixed(1)}`).join(" ");
 const pace=`M${p.l+bw/2} ${yc(a.fct/n)} L${(p.l+(n-1)*bw+bw/2).toFixed(1)} ${yc(a.fct)}`;
 $("chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas diarias y acumuladas frente al objetivo"><text x="${p.l}" y="12" font-size="9" fill="var(--dim)">DIARIA</text><text x="${W-p.r}" y="12" text-anchor="end" font-size="9" fill="var(--dim)">ACUMULADA</text>${g}${bars}<path d="${pace}" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="6 5"/><path d="${line}" fill="none" stroke="var(--violet)" stroke-width="2.5"/></svg>`;
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-k]");if(t){sel=t.dataset.k;render();}});
$("toggleLines").addEventListener("click",()=>{showAllLines=!showAllLines;render()});
const tip=$("tip");
document.addEventListener("mousemove",e=>{const t=e.target.closest("[data-tip]");if(t){tip.textContent=t.dataset.tip;tip.style.display="block";tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px"}else tip.style.display="none"});
function setTheme(t){document.documentElement.dataset.theme=t;$("theme").textContent=t==="dark"?"Tema claro":"Tema oscuro";try{localStorage.setItem("ventas-theme",t)}catch(e){}}
try{setTheme(localStorage.getItem("ventas-theme")==="light"?"light":"dark")}catch(e){}
$("theme").addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));

/* Datos guardados en el servidor */
const fmtFecha=iso=>{try{return new Date(iso).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return iso}};
let SERVER=false;
function usePayload(p,keepMonth){
 PAYLOAD=p;const keys=Object.keys(p.meses).sort();
 if(!keepMonth||!p.meses[MKEY]) MKEY=keys[keys.length-1];
 DATA=p.meses[MKEY];
 $("mes").innerHTML=keys.slice().reverse().map(k=>`<option value="${k}"${k===MKEY?" selected":""}>${esc(p.meses[k].mes)}</option>`).join("");
 $("upd").textContent=SERVER?`Última planilla: ${p.archivo} · subida el ${fmtFecha(p.actualizado)}`:"Datos de ejemplo incluidos en el sitio · subí la planilla para guardarla en el servidor";
 render();
}
$("mes").addEventListener("change",e=>{MKEY=e.target.value;DATA=PAYLOAD.meses[MKEY];render()});
async function loadServer(keepMonth){
 try{const r=await fetch("api/data",{cache:"no-store"});
  if(r.ok){SERVER=true;usePayload(await r.json(),keepMonth);return}
  if(r.status===404){SERVER=true;}
 }catch(e){}
 if(!DATA) usePayload(PAYLOAD,false);
}
function getToken(){try{return localStorage.getItem("ventas-token")||""}catch(e){return ""}}
function setToken(v){try{localStorage.setItem("ventas-token",v)}catch(e){}}
async function upload(f,token){
 return fetch("api/upload",{method:"POST",body:f,headers:{"Content-Type":"application/octet-stream","X-Filename":encodeURIComponent(f.name),"X-Upload-Token":token}});
}
$("file").addEventListener("change",async e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;
 if(!SERVER){$("msg").textContent="Para guardar la planilla, abrí el sitio desde el servidor (Portainer), no como archivo local.";return}
 $("msg").textContent=`Subiendo y procesando ${f.name}… (puede tardar unos segundos)`;
 try{let token=getToken();
  if(!token){const hl=await fetch("api/health",{cache:"no-store"}).then(r=>r.json()).catch(()=>({}));
   if(hl.uploadProtected){token=prompt("Código de carga:")||"";if(!token){$("msg").textContent="Carga cancelada.";return}}}
  let r=await upload(f,token);
  if(r.status===401){token=prompt("Código de carga:")||"";if(!token){$("msg").textContent="Carga cancelada.";return}r=await upload(f,token)}
  const j=await r.json().catch(()=>({error:"Respuesta inválida del servidor."}));
  if(!r.ok){if(r.status===401)setToken("");$("msg").textContent=j.error||("Error "+r.status);return}
  setToken(token);$("msg").textContent="";MKEY=null;usePayload(j,false);
 }catch(err){$("msg").textContent="No se pudo subir: "+err.message}
});
setInterval(()=>{if(SERVER&&!document.hidden)loadServer(true)},5*60*1000);
loadServer(false);
</script>
